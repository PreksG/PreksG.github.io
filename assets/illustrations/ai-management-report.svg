<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="t d">
  <title id="t">Illustration: AI-assisted weekly management report</title>
  <desc id="d">Conceptual diagram. Six Power BI semantic models pass through a freshness gate. If fresh, an AI assistant drafts a structured weekly briefing; if not, the report is held and an alert is sent instead.</desc>
  <defs>
    <pattern id="g" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#1f2933"/></pattern>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0l10 5-10 5z" fill="#7d8997"/></marker>
    <filter id="s" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity=".45"/></filter>
  </defs>
  <rect width="800" height="450" fill="#10161d"/>
  <rect width="800" height="450" fill="url(#g)"/>
  <g font-family="Consolas, Menlo, monospace" font-size="11" fill="#7d8997" letter-spacing="1">
    <text x="40" y="60">6 SEMANTIC MODELS</text><text x="262" y="60">GATE</text><text x="540" y="60">WEEKLY BRIEFING</text>
  </g>
  <g fill="none" stroke="#4d5b6a" stroke-width="1.6">
    <path d="M232 112c22 0 18 100 40 108"/><path d="M232 220h40"/><path d="M232 328c22 0 18-100 40-108" marker-end="url(#a)"/>
    <path d="M336 220h46" marker-end="url(#a)"/><path d="M466 220h54" marker-end="url(#a)"/>
    <path d="M304 254v70" stroke="#f0a64b" stroke-dasharray="4 4" marker-end="url(#a)"/>
  </g>
  <g filter="url(#s)" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#edf1f5">
    <g fill="#18202a" stroke="#313d4a" font-weight="400">
      <rect x="40" y="90" width="92" height="44" rx="8"/><rect x="140" y="90" width="92" height="44" rx="8"/>
      <rect x="40" y="198" width="92" height="44" rx="8"/><rect x="140" y="198" width="92" height="44" rx="8"/>
      <rect x="40" y="306" width="92" height="44" rx="8"/><rect x="140" y="306" width="92" height="44" rx="8"/>
    </g>
    <g fill="#f2c94c"><rect x="50" y="102" width="6" height="20" rx="1"/><rect x="150" y="102" width="6" height="20" rx="1"/><rect x="50" y="210" width="6" height="20" rx="1"/><rect x="150" y="210" width="6" height="20" rx="1"/><rect x="50" y="318" width="6" height="20" rx="1"/><rect x="150" y="318" width="6" height="20" rx="1"/></g>
    <text x="62" y="116">Credit</text><text x="162" y="116">Portfolio</text>
    <text x="62" y="224">Collections</text><text x="162" y="224">Coll. ops</text>
    <text x="62" y="332">Decisioning</text><text x="162" y="332">Executive</text>

    <path d="M304 186l34 34-34 34-34-34z" fill="#18202a" stroke="#dbe3ec" stroke-width="1.6"/>
    <text x="304" y="224" text-anchor="middle" font-size="11.5">Fresh?</text>

    <circle cx="424" cy="220" r="42" fill="#dbe3ec"/>
    <path d="M424 198l5 13 13 5-13 5-5 13-5-13-13-5 13-5z" fill="#18202a"/>
    <text x="424" y="286" text-anchor="middle" font-size="11.5" font-weight="400" fill="#95a1ae">AI drafts across models</text>

    <rect x="252" y="330" width="104" height="44" rx="8" fill="#2e2312" stroke="#d9a35a"/>
    <text x="304" y="350" text-anchor="middle" fill="#f3bb72">Not sent</text>
    <text x="304" y="365" text-anchor="middle" font-weight="400" font-size="10.5" fill="#f3bb72">alert to owner</text>

    <rect x="524" y="80" width="236" height="290" rx="10" fill="#18202a" stroke="#313d4a"/>
    <rect x="524" y="80" width="236" height="8" rx="4" fill="#dbe3ec"/>
    <text x="544" y="118" font-family="Georgia, serif" font-size="17" font-weight="400">Weekly briefing</text>
    <g font-weight="400" fill="#c5ced8" font-size="12">
      <text x="562" y="152">Executive summary</text><text x="562" y="180">Management scorecard</text><text x="562" y="208">Emerging risks</text><text x="562" y="236">Opportunities</text><text x="562" y="264">Recommended actions</text><text x="562" y="292">CEO brief</text>
    </g>
    <g fill="#dbe3ec"><rect x="544" y="144" width="8" height="8" rx="2"/><rect x="544" y="172" width="8" height="8" rx="2"/><rect x="544" y="200" width="8" height="8" rx="2"/><rect x="544" y="228" width="8" height="8" rx="2"/><rect x="544" y="256" width="8" height="8" rx="2"/><rect x="544" y="284" width="8" height="8" rx="2"/></g>
    <line x1="544" y1="312" x2="740" y2="312" stroke="#28323e"/>
    <circle cx="553" cy="340" r="9" fill="#3ccf8e"/><path d="M548.5 340l3 3 5-6" fill="none" stroke="#04140d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="570" y="344" font-weight="400" font-size="11.5" fill="#c5ced8">Sources listed for every KPI</text>
