<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="t d">
  <title id="t">Illustration: metadata-driven database replication</title>
  <desc id="d">Conceptual diagram. An on-premises SQL Server database, a lookup that discovers its tables at run time, a loop that copies each table to Parquet in ADLS Gen2, and a load into Microsoft Fabric.</desc>
  <defs>
    <pattern id="g" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#1f2933"/></pattern>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0l10 5-10 5z" fill="#7d8997"/></marker>
    <filter id="s" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity=".45"/></filter>
  </defs>
  <rect width="800" height="450" fill="#10161d"/>
  <rect width="800" height="450" fill="url(#g)"/>
  <g font-family="Consolas, Menlo, monospace" font-size="11" fill="#7d8997" letter-spacing="1"><text x="40" y="108">SQL SERVER</text><text x="214" y="108">DISCOVER</text><text x="388" y="108">COPY</text><text x="582" y="108">LAND AND LOAD</text></g>
  <g fill="none" stroke="#4d5b6a" stroke-width="1.6"><path d="M172 208h38" marker-end="url(#a)"/><path d="M346 208h38" marker-end="url(#a)"/><path d="M540 176h38" marker-end="url(#a)"/><path d="M671 204v22" marker-end="url(#a)"/></g>
  <g filter="url(#s)" font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <rect x="40" y="150" width="130" height="116" rx="10" fill="#18202a" stroke="#313d4a"/><ellipse cx="105" cy="182" rx="36" ry="10" fill="none" stroke="#dbe3ec" stroke-width="1.6"/><path d="M69 182v40c0 6 16 10 36 10s36-4 36-10v-40" fill="none" stroke="#dbe3ec" stroke-width="1.6"/><text x="56" y="254" font-size="11.5" fill="#95a1ae">on-premises</text><rect x="214" y="150" width="130" height="116" rx="8" fill="#18202a" stroke="#313d4a" stroke-width="1"/><text x="228" y="205" font-size="13" font-weight="600" fill="#edf1f5">Lookup</text><text x="228" y="222" font-size="11" fill="#95a1ae">discover tables</text><g fill="#3a4655"><rect x="228" y="234" width="100" height="7" rx="3"/><rect x="228" y="246" width="80" height="7" rx="3"/></g><rect x="388" y="130" width="150" height="156" rx="10" fill="#18202a" stroke="#dbe3ec" stroke-width="1.4"/><text x="402" y="156" font-size="13" font-weight="600" fill="#edf1f5">ForEach table</text><text x="402" y="174" font-size="11" fill="#95a1ae">copy to Parquet</text><rect x="402" y="188" width="122" height="14" rx="3" fill="#222c37" stroke="#313d4a"/><text x="410" y="199" font-family="Consolas, Menlo, monospace" font-size="9.5" fill="#7d8997">table_1.parquet</text><rect x="402" y="210" width="122" height="14" rx="3" fill="#222c37" stroke="#313d4a"/><text x="410" y="221" font-family="Consolas, Menlo, monospace" font-size="9.5" fill="#7d8997">table_2.parquet</text><rect x="402" y="232" width="122" height="14" rx="3" fill="#222c37" stroke="#313d4a"/><text x="410" y="243" font-family="Consolas, Menlo, monospace" font-size="9.5" fill="#7d8997">table_3.parquet</text><rect x="402" y="254" width="122" height="14" rx="3" fill="#222c37" stroke="#313d4a"/><text x="410" y="265" font-family="Consolas, Menlo, monospace" font-size="9.5" fill="#7d8997">table_4.parquet</text><rect x="582" y="150" width="178" height="52" rx="8" fill="#18202a" stroke="#313d4a" stroke-width="1"/><text x="596" y="173" font-size="13" font-weight="600" fill="#edf1f5">ADLS Gen2</text><text x="596" y="190" font-size="11" fill="#95a1ae">one file per table</text><rect x="582" y="230" width="178" height="52" rx="8" fill="#18202a" stroke="#313d4a" stroke-width="1"/><text x="596" y="253" font-size="13" font-weight="600" fill="#edf1f5">Microsoft Fabric</text><text x="596" y="270" font-size="11" fill="#95a1ae">loaded by a notebook</text><circle cx="46" cy="384" r="8" fill="#3ccf8e"/><path d="M42 384l3 3 5-6" fill="none" stroke="#04140d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="62" y="388" font-size="12" fill="#c5ced8">New tables picked up automatically</text><circle cx="330" cy="384" r="8" fill="#3ccf8e"/><path d="M326 384l3 3 5-6" fill="none" stroke="#04140d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="346" y="388" font-size="12" fill="#c5ced8">Runs on a schedule</text>
  </g>
</svg>
