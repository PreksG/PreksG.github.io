c" opacity=".9"/><text x="366" y="352" font-family="Consolas, Menlo, monospace" font-size="10.5" fill="#7d8997">W6</text><rect x="478" y="70" width="282" height="310" rx="10" fill="#18202a" stroke="#313d4a"/><text x="498" y="100" font-size="14" font-weight="600" fill="#edf1f5">Actual vs budget</text><text x="498" y="118" font-size="11.5" fill="#95a1ae">by channel</text><g font-family="Consolas, Menlo, monospace" font-size="10.5" fill="#7d8997"><text x="498" y="148">PERIOD</text><text x="690" y="148">VS BUDGET</text></g><line x1="498" y1="160" x2="740" y2="160" stroke="#28323e"/><text x="498" y="186" font-size="13" fill="#c5ced8">Week</text><rect x="600" y="176" width="70" height="12" rx="3" fill="#dbe3ec" opacity=".85"/><line x1="498" y1="200" x2="740" y2="200" stroke="#28323e"/><text x="498" y="226" font-size="13" fill="#c5ced8">Month to date</text><rect x="600" y="216" width="84" height="12" rx="3" fill="#dbe3ec" opacity=".85"/><line x1="498" y1="240" x2="740" y2="240" stroke="#28323e"/><text x="498" y="266" font-size="13" fill="#c5ced8">Year to date</text><rect x="600" y="256" width="62" height="12" rx="3" fill="#dbe3ec" opacity=".85"/><line x1="498" y1="280" x2="740" y2="280" stroke="#28323e"/><circle cx="507" cy="308" r="8" fill="#3ccf8e"/><path d="M503 308l3 3 5-6" fill="none" stroke="#04140d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="523" y="312" font-size="12" fill="#c5ced8">Data freshness checked</text><circle cx="507" cy="340" r="8" fill="#3ccf8e"/><path d="M503 340l3 3 5-6" fill="none" stroke="#04140d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="523" y="344" font-size="12" fill="#c5ced8">Validation checks passed</text>
