<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="t d">
  <title id="t">Illustration: sales-to-revenue pipeline</title>
  <desc id="d">Conceptual diagram. Life and General Business sales sources land in a Bronze layer, pass through business rules into a Gold dataset, and are reconciled on record counts and premium before use.</desc>
  <defs>
    <pattern id="g" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#d9dee6"/></pattern>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0l10 5-10 5z" fill="#7c8698"/></marker>
    <filter id="s" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0b1526" flood-opacity=".08"/></filter>
  </defs>
  <rect width="800" height="450" fill="#f7f8fa"/>
  <rect width="800" height="450" fill="url(#g)"/>
  <g font-family="Consolas, Menlo, monospace" font-size="11" fill="#7c8698" letter-spacing="1">
    <text x="40" y="52">SOURCES</text><text x="232" y="52">BRONZE</text><text x="402" y="52">RULES</text><text x="602" y="52">GOLD</text>
  </g>
  <g fill="none" stroke="#9aa4b4" stroke-width="1.6" marker-end="url(#a)">
    <path d="M172 132c30 0 30 70 56 70"/><path d="M172 272c30 0 30-60 56-60"/>
    <path d="M352 207h44"/><path d="M552 207h44"/>
    <path d="M676 268v60" />
  </g>
  <g filter="url(#s)" font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <rect x="40" y="100" width="132" height="64" rx="8" fill="#fff" stroke="#d2d7e0"/>
    <text x="56" y="128" font-size="14" font-weight="600" fill="#0b1526">Life Business</text>
    <text x="56" y="148" font-size="11.5" fill="#536074">digital policy sales</text>
    <rect x="40" y="240" width="132" height="64" rx="8" fill="#fff" stroke="#d2d7e0"/>
    <text x="56" y="268" font-size="14" font-weight="600" fill="#0b1526">General Business</text>
    <text x="56" y="288" font-size="11.5" fill="#536074">digital policy sales</text>

    <rect x="230" y="146" width="122" height="122" rx="10" fill="#fbf4ec" stroke="#c99a68"/>
    <rect x="246" y="166" width="90" height="10" rx="3" fill="#e7cfb3"/><rect x="246" y="184" width="70" height="10" rx="3" fill="#e7cfb3"/><rect x="246" y="202" width="84" height="10" rx="3" fill="#e7cfb3"/>
    <text x="246" y="240" font-size="14" font-weight="600" fill="#6b4318">Bronze</text>
    <text x="246" y="256" font-size="11" fill="#8a6440">raw, as received</text>

    <rect x="400" y="100" width="152" height="214" rx="10" fill="#fff" stroke="#d2d7e0"/>
    <text x="416" y="128" font-size="14" font-weight="600" fill="#0b1526">Business rules</text>
    <g font-size="12" fill="#27344a">
      <text x="436" y="158">Types and dates</text><text x="436" y="184">Channel mapping</text><text x="436" y="210">Start date</text>
      <text x="436" y="236">Premium &gt; 0</text><text x="436" y="262">Deduplicate</text><text x="436" y="288">Latest load</text>
    </g>
    <g fill="#0f2a4a"><rect x="418" y="149" width="10" height="10" rx="2"/><rect x="418" y="175" width="10" height="10" rx="2"/><rect x="418" y="201" width="10" height="10" rx="2"/><rect x="418" y="227" width="10" height="10" rx="2"/><rect x="418" y="253" width="10" height="10" rx="2"/><rect x="418" y="279" width="10" height="10" rx="2"/></g>

    <rect x="600" y="146" width="152" height="122" rx="10" fill="#fbf7e8" stroke="#c4a542"/>
    <g fill="#e9d79a"><rect x="616" y="166" width="120" height="10" rx="3"/><rect x="616" y="184" width="120" height="10" rx="3"/><rect x="616" y="202" width="120" height="10" rx="3"/></g>
    <text x="616" y="240" font-size="14" font-weight="600" fill="#5c4a0e">Gold</text>
    <text x="616" y="256" font-size="11" fill="#7a6626">reporting-ready, one grain</text>

    <rect x="400" y="330" width="352" height="74" rx="10" fill="#fff" stroke="#0d7266" stroke-width="1.4"/>
    <text x="418" y="356" font-size="14" font-weight="600" fill="#0b1526">Reconcile before use</text>
    <circle cx="426" cy="381" r="8" fill="#0d7266"/><path d="M422 381l3 3 5-6" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="440" y="385" font-size="12" fill="#27344a">Counts = source</text>
    <circle cx="566" cy="381" r="8" fill="#0d7266"/><path d="M562 381l3 3 5-6" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="580" y="385" font-size="12" fill="#27344a">Premium = finance</text>
  </g>
</svg>
