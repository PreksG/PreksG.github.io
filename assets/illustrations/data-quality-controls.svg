<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="t d">
  <title id="t">Illustration: data quality and reconciliation controls</title>
  <desc id="d">Conceptual diagram. A pipeline from source to publication with a control check at each stage: counts and freshness at landing, duplicates removed in the rules, row counts compared in the model, totals reconciled at the output, and a freshness gate before publishing.</desc>
  <defs>
    <pattern id="g" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#1f2933"/></pattern>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0l10 5-10 5z" fill="#7d8997"/></marker>
    <filter id="s" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity=".45"/></filter>
  </defs>
  <rect width="800" height="450" fill="#10161d"/>
  <rect width="800" height="450" fill="url(#g)"/>
  <g font-family="Consolas, Menlo, monospace" font-size="11" fill="#7d8997" letter-spacing="1"><text x="40" y="120">PIPELINE STAGE</text><text x="40" y="330"></text></g>
  <g fill="none" stroke="#4d5b6a" stroke-width="1.6"><path d="M170 182h16" marker-end="url(#a)"/><path d="M318 182h16" marker-end="url(#a)"/><path d="M466 182h16" marker-end="url(#a)"/><path d="M614 182h16" marker-end="url(#a)"/></g>
  <g filter="url(#s)" font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <rect x="40" y="150" width="128" height="64" rx="8" fill="#18202a" stroke="#313d4a" stroke-width="1"/><text x="54" y="179" font-size="13" font-weight="600" fill="#edf1f5">Source</text><text x="54" y="196" font-size="11" fill="#95a1ae">landing</text><circle cx="104" cy="262" r="15" fill="#3ccf8e"/><path d="M97 262l5 5 9-10" fill="none" stroke="#04140d" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><line x1="104" y1="216" x2="104" y2="246" stroke="#4d5b6a" stroke-width="1.4" stroke-dasharray="3 3"/><rect x="188" y="150" width="128" height="64" rx="8" fill="#18202a" stroke="#313d4a" stroke-width="1"/><text x="202" y="179" font-size="13" font-weight="600" fill="#edf1f5">Rules</text><text x="202" y="196" font-size="11" fill="#95a1ae">types, dates</text><circle cx="252" cy="262" r="15" fill="#3ccf8e"/><path d="M245 262l5 5 9-10" fill="none" stroke="#04140d" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><line x1="252" y1="216" x2="252" y2="246" stroke="#4d5b6a" stroke-width="1.4" stroke-dasharray="3 3"/><rect x="336" y="150" width="128" height="64" rx="8" fill="#18202a" stroke="#313d4a" stroke-width="1"/><text x="350" y="179" font-size="13" font-weight="600" fill="#edf1f5">Model</text><text x="350" y="196" font-size="11" fill="#95a1ae">declared grain</text><circle cx="400" cy="262" r="15" fill="#3ccf8e"/><path d="M393 262l5 5 9-10" fill="none" stroke="#04140d" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><line x1="400" y1="216" x2="400" y2="246" stroke="#4d5b6a" stroke-width="1.4" stroke-dasharray="3 3"/><rect x="484" y="150" width="128" height="64" rx="8" fill="#18202a" stroke="#313d4a" stroke-width="1"/><text x="498" y="179" font-size="13" font-weight="600" fill="#edf1f5">Output</text><text x="498" y="196" font-size="11" fill="#95a1ae">reconciled</text><circle cx="548" cy="262" r="15" fill="#3ccf8e"/><path d="M541 262l5 5 9-10" fill="none" stroke="#04140d" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><line x1="548" y1="216" x2="548" y2="246" stroke="#4d5b6a" stroke-width="1.4" stroke-dasharray="3 3"/><rect x="632" y="150" width="128" height="64" rx="8" fill="#18202a" stroke="#313d4a" stroke-width="1"/><text x="646" y="179" font-size="13" font-weight="600" fill="#edf1f5">Publish</text><text x="646" y="196" font-size="11" fill="#95a1ae">freshness gate</text><circle cx="696" cy="262" r="15" fill="#3ccf8e"/><path d="M689 262l5 5 9-10" fill="none" stroke="#04140d" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><line x1="696" y1="216" x2="696" y2="246" stroke="#4d5b6a" stroke-width="1.4" stroke-dasharray="3 3"/><text x="104" y="300" font-size="11.5" text-anchor="middle" fill="#c5ced8">counts, freshness</text><text x="252" y="300" font-size="11.5" text-anchor="middle" fill="#c5ced8">duplicates removed</text><text x="400" y="300" font-size="11.5" text-anchor="middle" fill="#c5ced8">rows before = after</text><text x="548" y="300" font-size="11.5" text-anchor="middle" fill="#c5ced8">totals = control</text><text x="696" y="300" font-size="11.5" text-anchor="middle" fill="#c5ced8">no stale send</text><rect x="40" y="338" width="720" height="44" rx="8" fill="#2e2312" stroke="#f0a64b" stroke-dasharray="5 4"/><text x="58" y="365" font-size="12.5" fill="#f3bb72">A check fails: stop, trace the cause upstream, fix at the right layer</text>
  </g>
</svg>
