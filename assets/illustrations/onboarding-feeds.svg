<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="t d">
  <title id="t">Illustration: customer onboarding feeds</title>
  <desc id="d">Conceptual diagram. General and life policy-admin systems each feed a list of newly onboarded customers into the Gold layer, which supplies the customer-experience Power BI dashboard.</desc>
  <defs>
    <pattern id="g" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#1f2933"/></pattern>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0l10 5-10 5z" fill="#7d8997"/></marker>
    <filter id="s" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity=".45"/></filter>
  </defs>
  <rect width="800" height="450" fill="#10161d"/>
  <rect width="800" height="450" fill="url(#g)"/>
  <g font-family="Consolas, Menlo, monospace" font-size="11" fill="#7d8997" letter-spacing="1"><text x="40" y="70">SOURCES</text><text x="250" y="70">FEEDS</text><text x="460" y="70">LAKEHOUSE</text><text x="620" y="70">CX TEAM</text></g>
  <g fill="none" stroke="#4d5b6a" stroke-width="1.6"><path d="M202 132h44" marker-end="url(#a)"/><path d="M202 282h44" marker-end="url(#a)"/><path d="M412 132c26 0 22 52 44 58" marker-end="url(#a)"/><path d="M412 282c26 0 22-52 44-58" marker-end="url(#a)"/><path d="M582 207h34" marker-end="url(#a)"/></g>
  <g filter="url(#s)" font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <rect x="40" y="100" width="160" height="64" rx="8" fill="#18202a" stroke="#313d4a" stroke-width="1"/><text x="54" y="129" font-size="13" font-weight="600" fill="#edf1f5">General insurance</text><text x="54" y="146" font-size="11" fill="#95a1ae">policy-admin system</text><rect x="40" y="250" width="160" height="64" rx="8" fill="#18202a" stroke="#313d4a" stroke-width="1"/><text x="54" y="279" font-size="13" font-weight="600" fill="#edf1f5">Life</text><text x="54" y="296" font-size="11" fill="#95a1ae">policy-admin system</text><rect x="250" y="100" width="160" height="64" rx="8" fill="#18202a" stroke="#313d4a" stroke-width="1"/><text x="264" y="129" font-size="13" font-weight="600" fill="#edf1f5">New clients</text><text x="264" y="146" font-size="11" fill="#95a1ae">since January, with policies</text><rect x="250" y="250" width="160" height="64" rx="8" fill="#18202a" stroke="#313d4a" stroke-width="1"/><text x="264" y="279" font-size="13" font-weight="600" fill="#edf1f5">New clients</text><text x="264" y="296" font-size="11" fill="#95a1ae">excl. group &amp; corporate</text><rect x="460" y="150" width="120" height="114" rx="10" fill="#28240f" stroke="#c4a542"/><g fill="#6b5d2a"><rect x="476" y="170" width="88" height="10" rx="3"/><rect x="476" y="188" width="88" height="10" rx="3"/></g><text x="476" y="230" font-size="14" font-weight="600" fill="#ead47e">Gold</text><text x="476" y="248" font-size="11" fill="#bfae6a">Parquet feeds</text><rect x="620" y="130" width="140" height="154" rx="10" fill="#18202a" stroke="#313d4a"/><text x="636" y="158" font-size="13" font-weight="600" fill="#edf1f5">CX dashboard</text><rect x="636" y="172" width="16" height="16" rx="3" fill="#f2c94c"/><text x="660" y="185" font-size="11" fill="#95a1ae">Power BI</text><g fill="#3a4655"><rect x="636" y="202" width="108" height="8" rx="3"/><rect x="636" y="218" width="84" height="8" rx="3"/><rect x="636" y="234" width="96" height="8" rx="3"/><rect x="636" y="250" width="70" height="8" rx="3"/></g><circle cx="46" cy="384" r="8" fill="#3ccf8e"/><path d="M42 384l3 3 5-6" fill="none" stroke="#04140d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="62" y="388" font-size="12" fill="#c5ced8">Replaces manual extracts</text>
