<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="t d">
  <title id="t">Illustration: legacy-to-ERP general-ledger crosswalk</title>
  <desc id="d">Conceptual diagram. General and life legacy ledgers are copied to the lake, transactions in the parallel-run month are matched one to one, and each legacy account is mapped to a Dynamics 365 F&amp;O account with a confidence flag.</desc>
  <defs>
    <pattern id="g" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#1f2933"/></pattern>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0l10 5-10 5z" fill="#7d8997"/></marker>
    <filter id="s" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity=".45"/></filter>
  </defs>
  <rect width="800" height="450" fill="#10161d"/>
  <rect width="800" height="450" fill="url(#g)"/>
  <g font-family="Consolas, Menlo, monospace" font-size="11" fill="#7d8997" letter-spacing="1"><text x="40" y="62">LEGACY LEDGERS</text><text x="226" y="62">BEFORE</text><text x="408" y="62">AFTER</text><text x="572" y="62">DYNAMICS 365 F&amp;O</text></g>
  <g fill="none" stroke="#4d5b6a" stroke-width="1.6"><path d="M182 136c24 0 22 56 42 62" marker-end="url(#a)"/><path d="M182 276c24 0 22-56 42-62" marker-end="url(#a)"/><path d="M364 206h40" marker-end="url(#a)"/><path d="M530 206h38" marker-end="url(#a)"/></g>
  <g filter="url(#s)" font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <rect x="40" y="110" width="140" height="52" rx="8" fill="#18202a" stroke="#313d4a" stroke-width="1"/><text x="54" y="133" font-size="13" font-weight="600" fill="#edf1f5">General ledger</text><text x="54" y="150" font-size="11" fill="#95a1ae">legacy, general</text><rect x="40" y="250" width="140" height="52" rx="8" fill="#18202a" stroke="#313d4a" stroke-width="1"/><text x="54" y="273" font-size="13" font-weight="600" fill="#edf1f5">Life ledger</text><text x="54" y="290" font-size="11" fill="#95a1ae">legacy, life</text><rect x="226" y="170" width="136" height="72" rx="8" fill="#18202a" stroke="#313d4a" stroke-width="1"/><text x="240" y="203" font-size="13" font-weight="600" fill="#edf1f5">Full dumps</text><text x="240" y="220" font-size="11" fill="#95a1ae">control-table driven</text><rect x="408" y="140" width="120" height="132" rx="8" fill="#18202a" stroke="#dbe3ec" stroke-width="1.4"/><text x="422" y="203" font-size="13" font-weight="600" fill="#edf1f5">1:1 match</text><text x="422" y="220" font-size="11" fill="#95a1ae">parallel-run month</text><text x="422" y="244" font-size="11" fill="#c5ced8">same document</text><text x="422" y="260" font-size="11" fill="#c5ced8">same amount</text><rect x="572" y="84" width="190" height="246" rx="10" fill="#18202a" stroke="#313d4a"/><text x="588" y="112" font-size="13" font-weight="600" fill="#edf1f5">Crosswalk</text><text x="588" y="130" font-size="11" fill="#95a1ae">legacy GL → F&amp;O account</text><rect x="588" y="148" width="60" height="10" rx="3" fill="#3a4655"/><path d="M654 153h22" stroke="#4d5b6a" stroke-width="1.4"/><rect x="682" y="148" width="50" height="10" rx="3" fill="#dbe3ec" opacity=".85"/><circle cx="746" cy="153" r="6" fill="#3ccf8e"/><rect x="588" y="182" width="60" height="10" rx="3" fill="#3a4655"/><path d="M654 187h22" stroke="#4d5b6a" stroke-width="1.4"/><rect x="682" y="182" width="50" height="10" rx="3" fill="#dbe3ec" opacity=".85"/><circle cx="746" cy="187" r="6" fill="#3ccf8e"/><rect x="588" y="216" width="60" height="10" rx="3" fill="#3a4655"/><path d="M654 221h22" stroke="#4d5b6a" stroke-width="1.4"/><rect x="682" y="216" width="50" height="10" rx="3" fill="#dbe3ec" opacity=".85"/><circle cx="746" cy="221" r="6" fill="none" stroke="#f0a64b" stroke-width="1.6"/><rect x="588" y="250" width="60" height="10" rx="3" fill="#3a4655"/><path d="M654 255h22" stroke="#4d5b6a" stroke-width="1.4"/><rect x="682" y="250" width="50" height="10" rx="3" fill="#dbe3ec" opacity=".85"/><circle cx="746" cy="255" r="6" fill="#3ccf8e"/><rect x="588" y="284" width="60" height="10" rx="3" fill="#3a4655"/><path d="M654 289h22" stroke="#4d5b6a" stroke-width="1.4"/><rect x="682" y="284" width="50" height="10" rx="3" fill="#dbe3ec" opacity=".85"/><circle cx="746" cy="289" r="6" fill="#3ccf8e"/><text x="588" y="318" font-size="11" fill="#95a1ae">confidence flag per row</text><circle cx="46" cy="384" r="8" fill="#3ccf8e"/><path d="M42 384l3 3 5-6" fill="none" stroke="#04140d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="62" y="388" font-size="12" fill="#c5ced8">Unique 1:1 pairs only</text><circle cx="286" cy="384" r="8" fill="#3ccf8e"/><path d="M282 384l3 3 5-6" fill="none" stroke="#04140d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="302" y="388" font-size="12" fill="#c5ced8">Monthly totals compared per account</text>
  </g>
</svg>
