<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="t d">
  <title id="t">Illustration: dashboard root-cause analysis</title>
  <desc id="d">Conceptual diagram. A dashboard chart shows a suspicious spike. Its lineage is traced down through the report, DAX measure, data model, warehouse table and source load, and the cause is isolated at the warehouse layer.</desc>
  <defs>
    <pattern id="g" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#d9dee6"/></pattern>
    <filter id="s" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0b1526" flood-opacity=".08"/></filter>
  </defs>
  <rect width="800" height="450" fill="#f7f8fa"/>
  <rect width="800" height="450" fill="url(#g)"/>
  <g filter="url(#s)" font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <rect x="40" y="70" width="320" height="310" rx="10" fill="#fff" stroke="#d2d7e0"/>
    <text x="60" y="102" font-size="14" font-weight="600" fill="#0b1526">Dashboard</text>
    <text x="60" y="120" font-size="11.5" fill="#536074">symptom: figure looks wrong</text>
    <g fill="#f1f4f8"><rect x="60" y="136" width="86" height="48" rx="6"/><rect x="156" y="136" width="86" height="48" rx="6"/><rect x="252" y="136" width="88" height="48" rx="6"/></g>
    <g fill="#cfd6e0"><rect x="70" y="148" width="40" height="7" rx="3"/><rect x="166" y="148" width="40" height="7" rx="3"/><rect x="262" y="148" width="40" height="7" rx="3"/></g>
    <g fill="#0f2a4a"><rect x="70" y="162" width="56" height="12" rx="3"/><rect x="166" y="162" width="56" height="12" rx="3"/></g>
    <rect x="262" y="162" width="56" height="12" rx="3" fill="#9a5800"/>
    <line x1="60" y1="350" x2="340" y2="350" stroke="#cfd6e0"/>
    <path d="M64 320l40-12 40 8 40-20 40 4 40-14" fill="none" stroke="#0f2a4a" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M264 286l20-78 20 66 30-8" fill="none" stroke="#9a5800" stroke-width="2.5" stroke-linejoin="round"/>
    <circle cx="284" cy="224" r="30" fill="rgba(154,88,0,.06)" stroke="#0b1526" stroke-width="2.5"/>
    <path d="M305 245l20 20" stroke="#0b1526" stroke-width="5" stroke-linecap="round"/>

    <g font-size="12.5">
      <rect x="420" y="70" width="340" height="44" rx="8" fill="#fff" stroke="#d2d7e0"/>
      <rect x="420" y="128" width="340" height="44" rx="8" fill="#fff" stroke="#d2d7e0"/>
      <rect x="420" y="186" width="340" height="44" rx="8" fill="#fff" stroke="#d2d7e0"/>
      <rect x="420" y="244" width="340" height="58" rx="8" fill="#fcf2e3" stroke="#9a5800" stroke-width="1.4"/>
      <rect x="420" y="316" width="340" height="44" rx="8" fill="#fff" stroke="#d2d7e0"/>
      <g font-family="Consolas, Menlo, monospace" font-size="10.5" fill="#7c8698"><text x="436" y="97">01</text><text x="436" y="155">02</text><text x="436" y="213">03</text><text x="436" y="271" fill="#9a5800">04</text><text x="436" y="343">05</text></g>
      <g fill="#0b1526" font-weight="600"><text x="464" y="97">Report visual</text><text x="464" y="155">DAX measure and filters</text><text x="464" y="213">Data model and joins</text><text x="464" y="271" fill="#7a4600">Warehouse table</text><text x="464" y="343">Source load</text></g>
      <text x="464" y="290" font-size="11.5" fill="#7a4600">Cause isolated here, fixed at this layer</text>
      <g fill="#7c8698" font-size="11"><text x="744" y="97" text-anchor="end">checked</text><text x="744" y="155" text-anchor="end">checked</text><text x="744" y="213" text-anchor="end">checked</text><text x="744" y="343" text-anchor="end">checked</text></g>
    </g>
    <path d="M400 92v248" stroke="#cfd6e0" stroke-width="1.5" stroke-dasharray="3 4"/>
    <g fill="#0f2a4a"><circle cx="400" cy="92" r="4"/><circle cx="400" cy="150" r="4"/><circle cx="400" cy="208" r="4"/><circle cx="400" cy="338" r="4"/></g>
    <circle cx="400" cy="273" r="6" fill="#9a5800"/>
  </g>
</svg>
