<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="t d">
  <title id="t">Illustration: digital quote platform ingestion</title>
  <desc id="d">Conceptual diagram. Five tables from a digital quoting app&#x27;s database are found by a lookup, copied one by one to ADLS Gen2, and promoted to the Silver layer.</desc>
  <defs>
    <pattern id="g" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#1f2933"/></pattern>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0l10 5-10 5z" fill="#7d8997"/></marker>
    <filter id="s" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity=".45"/></filter>
  </defs>
  <rect width="800" height="450" fill="#10161d"/>
  <rect width="800" height="450" fill="url(#g)"/>
  <g font-family="Consolas, Menlo, monospace" font-size="11" fill="#7d8997" letter-spacing="1"><text x="40" y="70">SOURCE</text><text x="254" y="70">DISCOVER</text><text x="428" y="70">COPY</text><text x="602" y="70">LAKEHOUSE</text></g>
  <g fill="none" stroke="#4d5b6a" stroke-width="1.6"><path d="M212 216h38" marker-end="url(#a)"/><path d="M386 216h38" marker-end="url(#a)"/><path d="M560 206c22 0 18-50 38-58" marker-end="url(#a)"/><path d="M681 176v78" marker-end="url(#a)"/></g>
  <g filter="url(#s)" font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <rect x="40" y="90" width="170" height="250" rx="10" fill="#18202a" stroke="#313d4a"/><text x="56" y="118" font-size="13" font-weight="600" fill="#edf1f5">Quoting app DB</text><text x="56" y="136" font-size="11" fill="#95a1ae">five tables in scope</text><rect x="56" y="152" width="138" height="24" rx="5" fill="#222c37" stroke="#313d4a"/><text x="66" y="168" font-size="11.5" fill="#c5ced8">Products</text><rect x="56" y="186" width="138" height="24" rx="5" fill="#222c37" stroke="#313d4a"/><text x="66" y="202" font-size="11.5" fill="#c5ced8">Quotes</text><rect x="56" y="220" width="138" height="24" rx="5" fill="#222c37" stroke="#313d4a"/><text x="66" y="236" font-size="11.5" fill="#c5ced8">Quoting clients</text><rect x="56" y="254" width="138" height="24" rx="5" fill="#222c37" stroke="#313d4a"/><text x="66" y="270" font-size="11.5" fill="#c5ced8">Vehicle quotes</text><rect x="56" y="288" width="138" height="24" rx="5" fill="#222c37" stroke="#313d4a"/><text x="66" y="304" font-size="11.5" fill="#c5ced8">Travel quotes</text><rect x="254" y="176" width="130" height="80" rx="8" fill="#18202a" stroke="#313d4a" stroke-width="1"/><text x="268" y="213" font-size="13" font-weight="600" fill="#edf1f5">Lookup</text><text x="268" y="230" font-size="11" fill="#95a1ae">information schema</text><rect x="428" y="176" width="130" height="80" rx="8" fill="#18202a" stroke="#dbe3ec" stroke-width="1.4"/><text x="442" y="213" font-size="13" font-weight="600" fill="#edf1f5">ForEach</text><text x="442" y="230" font-size="11" fill="#95a1ae">copy each table</text><rect x="602" y="110" width="158" height="64" rx="8" fill="#18202a" stroke="#313d4a" stroke-width="1"/><text x="616" y="139" font-size="13" font-weight="600" fill="#edf1f5">ADLS Gen2</text><text x="616" y="156" font-size="11" fill="#95a1ae">landing</text><rect x="602" y="258" width="158" height="64" rx="8" fill="#1d2630" stroke="#9aa9b8"/><text x="616" y="286" font-size="13" font-weight="600" fill="#edf1f5">Silver</text><text x="616" y="303" font-size="11" fill="#95a1ae">promoted by notebooks</text><circle cx="46" cy="392" r="8" fill="#3ccf8e"/><path d="M42 392l3 3 5-6" fill="none" stroke="#04140d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="62" y="396" font-size="12" fill="#c5ced8">Ready for quote-to-policy reporting</text>
  </g>
</svg>
